events {}

http {
    upstream service1_backend {
        server service1_instance1:8199;
        server service1_instance2:8199;
        server service1_instance3:8199;
    }

    server {
        listen 80;

        # Basic authentication for main interface
        location / {
            auth_basic "Restricted Access";
            auth_basic_user_file /etc/nginx/.htpasswd;

            root /usr/share/nginx/html;
            index index.html;
        }

        # Proxy to Service 1 instances for /request endpoint
        location /request {
            proxy_pass http://service1_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy /stop to control_service
        location /stop {
            proxy_pass http://control_service:3000/stop;
        }
    }
}
